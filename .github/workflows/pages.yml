name: Deploy diagram to Pages

on:
  push:
    branches: [main]
    paths:
      - '02_pandas/analiza_dijagram.html'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Assemble site
        run: |
          mkdir -p _site
          cp 02_pandas/analiza_dijagram.html _site/index.html
          cp 02_pandas/analiza_dijagram.html _site/analiza_dijagram.html

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
